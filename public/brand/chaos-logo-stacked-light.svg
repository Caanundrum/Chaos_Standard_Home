<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" fill="none">
  <!-- Stacked Logo (Light) -->
  <rect width="600" height="650" rx="28" fill="#FFFFFF"/>
  <rect width="600" height="650" rx="28" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Centered Dimensional Outline Mark -->
  <g transform="translate(300, 210) scale(1.15)">
    <circle cx="0" cy="0" r="88" stroke="#0891B2" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 10"/>
    <g transform="rotate(-15)">
      <rect x="-56" y="-56" width="112" height="112" rx="32" stroke="#0891B2" stroke-width="4" fill="#0891B2" fill-opacity="0.08"/>
      <rect x="-38" y="-38" width="76" height="76" rx="22" stroke="#0891B2" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="-42" y1="-42" x2="-30" y2="-30" stroke="#0891B2" stroke-width="2" stroke-opacity="0.4"/>
      <line x1="42" y1="-42" x2="30" y2="-30" stroke="#0891B2" stroke-width="2" stroke-opacity="0.4"/>
      <line x1="-42" y1="42" x2="-30" y2="30" stroke="#0891B2" stroke-width="2" stroke-opacity="0.4"/>
      <line x1="42" y1="42" x2="30" y2="30" stroke="#0891B2" stroke-width="2" stroke-opacity="0.4"/>

      <!-- Docked pieces -->
      <rect x="-48" y="-56" width="14" height="14" rx="3.5" fill="#0891B2"/>
      <g transform="translate(38, 38) rotate(25)">
        <rect x="-5" y="-16" width="10" height="32" rx="4" fill="#D97706"/>
      </g>
    </g>
  </g>

  <!-- Typography -->
  <text x="300" y="415" fill="#0891B2" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="13" font-weight="700" letter-spacing="8" text-anchor="middle">
    BROWSER GAMES × AI
  </text>
  <text x="300" y="480" fill="#0F172A" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="12" text-anchor="middle">
    CHAOS STANDARD
  </text>
  <text x="300" y="530" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" letter-spacing="3" text-anchor="middle">
    UNCONVENTIONAL BROWSER EXPERIMENTS
  </text>
</svg>
