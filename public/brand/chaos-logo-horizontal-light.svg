      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="hzLightCyan" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <!-- Light Canvas Base -->
  <rect width="900" height="240" rx="24" fill="#FFFFFF"/>
  <rect width="900" height="240" rx="24" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Left: Emblem Mark -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="82" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 4"/>
    <circle cx="0" cy="0" r="74" stroke="#D97706" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="68" stroke="#0284C7" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="20 10"/>

    <line x1="0" y1="-86" x2="0" y2="-72" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="72" x2="0" y2="86" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="-86" y1="0" x2="-72" y2="0" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
    <line x1="72" y1="0" x2="86" y2="0" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>

    <path d="M 0 -48 L 46 38 L 24 38 L 0 -8 L -24 38 L -14 38 L 0 10 Z" fill="url(#hzLightGold)"/>
    <path d="M 46 38 L -46 38 L -36 20 L 24 20 L 0 -28 L 10 -28 Z" fill="url(#hzLightCyan)"/>
    <path d="M -46 38 L 0 -48 L 10 -28 L -24 38 Z" fill="#0F172A"/>

    <circle cx="0" cy="5" r="6" fill="#0F172A"/>
    <circle cx="0" cy="5" r="3" fill="#FFFFFF"/>
    <circle cx="0" cy="5" r="1.5" fill="#D97706"/>
  </g>

