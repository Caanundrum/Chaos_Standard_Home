<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" fill="none">
  <!-- Clean, bold, iconic Chaos Standard stacked logo (Dark) -->
  <rect width="600" height="650" rx="28" fill="#090A0F"/>
  <rect width="600" height="650" rx="28" stroke="#232736" stroke-width="1.5"/>

  <!-- Centered Impossible Delta Mark -->
  <g transform="translate(300, 210) scale(1.15)">
    <path d="M 0 -86 L 75 43 L 45 43 L 0 -34 L 15 -60 Z" fill="#F5A623"/>
    <path d="M 75 43 L -75 43 L -60 17 L 30 17 L 45 43 Z" fill="#00E5FF"/>
    <path d="M -75 43 L 0 -86 L 15 -60 L -30 17 L -60 17 Z" fill="#F8FAFC"/>
  </g>

  <!-- Studio Typography -->
  <text x="300" y="410" fill="#00E5FF" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="13" font-weight="700" letter-spacing="8" text-anchor="middle">
    INDEPENDENT GAME STUDIO
  </text>
  <text x="300" y="475" fill="#F8FAFC" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="12" text-anchor="middle">
    CHAOS STANDARD
  </text>
  <text x="300" y="525" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" letter-spacing="3" text-anchor="middle">
    WE TAKE MAKING RIDICULOUS THINGS EXTREMELY SERIOUSLY.
  </text>
</svg>
