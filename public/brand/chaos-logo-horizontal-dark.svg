<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <!-- Clean horizontal logo with dimensional outline mark (Dark) -->
  <rect width="800" height="200" rx="20" fill="#07090E"/>
  <rect width="800" height="200" rx="20" stroke="#161C26" stroke-width="1.5"/>

  <!-- Left: Dimensional Outline Mark (Centered at 110, 100) -->
  <g transform="translate(110, 100)">
    <!-- Outer ambient circle -->
    <circle cx="0" cy="0" r="68" stroke="#6EE7FF" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Tilted Outline Squircle -->
    <g transform="rotate(-15)">
      <rect x="-42" y="-42" width="84" height="84" rx="24" stroke="#6EE7FF" stroke-width="3" fill="#6EE7FF" fill-opacity="0.08"/>
      <rect x="-28" y="-28" width="56" height="56" rx="16" stroke="#6EE7FF" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="-32" y1="-32" x2="-22" y2="-22" stroke="#6EE7FF" stroke-width="1.5" stroke-opacity="0.4"/>
      <line x1="32" y1="-32" x2="22" y2="-22" stroke="#6EE7FF" stroke-width="1.5" stroke-opacity="0.4"/>
      <line x1="-32" y1="32" x2="-22" y2="22" stroke="#6EE7FF" stroke-width="1.5" stroke-opacity="0.4"/>
      <line x1="32" y1="32" x2="22" y2="22" stroke="#6EE7FF" stroke-width="1.5" stroke-opacity="0.4"/>

      <!-- Docked pieces -->
      <rect x="-35" y="-42" width="10" height="10" rx="2.5" fill="#6EE7FF"/>
      <g transform="translate(28, 28) rotate(25)">
        <rect x="-4" y="-12" width="8" height="24" rx="3" fill="#FF9F43"/>
      </g>
    </g>
  </g>

  <!-- Vertical Divider Wire -->
  <line x1="205" y1="45" x2="205" y2="155" stroke="#161C26" stroke-width="1.5"/>

  <!-- Right: Typography -->
  <text x="240" y="82" fill="#6EE7FF" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="12" font-weight="700" letter-spacing="6">
    BROWSER GAMES × AI
  </text>
  <text x="238" y="132" fill="#F8FAFC" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="48" font-weight="800" letter-spacing="8">
    CHAOS STANDARD
  </text>
</svg>
