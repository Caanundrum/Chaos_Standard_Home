<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <!-- Clean, bold, iconic Chaos Standard horizontal logo (Dark) -->
  <rect width="800" height="200" rx="20" fill="#090A0F"/>
  <rect width="800" height="200" rx="20" stroke="#232736" stroke-width="1.5"/>

  <!-- Left: The Impossible Delta Mark (Centered at 110, 100) -->
  <g transform="translate(110, 100) scale(0.68)">
    <path d="M 0 -86 L 75 43 L 45 43 L 0 -34 L 15 -60 Z" fill="#F5A623"/>
    <path d="M 75 43 L -75 43 L -60 17 L 30 17 L 45 43 Z" fill="#00E5FF"/>
    <path d="M -75 43 L 0 -86 L 15 -60 L -30 17 L -60 17 Z" fill="#F8FAFC"/>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="200" y1="45" x2="200" y2="155" stroke="#232736" stroke-width="1.5"/>

  <!-- Right: Studio Typography -->
  <text x="235" y="80" fill="#00E5FF" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="12" font-weight="700" letter-spacing="6">
    INDEPENDENT GAME STUDIO
  </text>
  <text x="233" y="132" fill="#F8FAFC" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="50" font-weight="800" letter-spacing="8">
    CHAOS STANDARD
  </text>
</svg>
