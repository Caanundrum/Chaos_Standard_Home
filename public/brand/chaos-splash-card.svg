<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <!-- Clean, monumental "A Chaos Standard Game" Splash Card (16:9) -->
  <rect width="1920" height="1080" fill="#090A0F"/>

  <!-- Subtle ambient radial bloom -->
  <circle cx="960" cy="460" r="400" fill="#F5A623" opacity="0.08" filter="blur(80px)"/>

  <!-- Top "A" -->
  <text x="960" y="230" fill="#00E5FF" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="22" font-weight="700" letter-spacing="16" text-anchor="middle">
    A
  </text>

  <!-- Centered Impossible Delta Mark -->
  <g transform="translate(960, 470) scale(1.85)">
    <path d="M 0 -86 L 75 43 L 45 43 L 0 -34 L 15 -60 Z" fill="#F5A623"/>
    <path d="M 75 43 L -75 43 L -60 17 L 30 17 L 45 43 Z" fill="#00E5FF"/>
    <path d="M -75 43 L 0 -86 L 15 -60 L -30 17 L -60 17 Z" fill="#F8FAFC"/>
  </g>

  <!-- Wordmark Main -->
  <text x="960" y="760" fill="#F8FAFC" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="80" font-weight="800" letter-spacing="24" text-anchor="middle">
    CHAOS STANDARD
  </text>

  <!-- GAME Subtitle -->
  <text x="960" y="830" fill="#F5A623" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="28" font-weight="700" letter-spacing="16" text-anchor="middle">
    GAME
  </text>

  <!-- Studio Motto -->
  <text x="960" y="940" fill="#64748B" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="500" letter-spacing="4" text-anchor="middle">
    WE TAKE MAKING RIDICULOUS THINGS EXTREMELY SERIOUSLY.
  </text>
</svg>
