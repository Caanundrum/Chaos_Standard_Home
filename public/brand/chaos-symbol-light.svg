<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Light Theme Dimensional Outline Symbol -->
  <rect width="512" height="512" rx="96" fill="#FFFFFF"/>
  <rect width="512" height="512" rx="96" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Outer Faint Concentric Rings -->
  <circle cx="256" cy="256" r="195" stroke="#0891B2" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 10"/>
  <circle cx="256" cy="256" r="172" stroke="#0891B2" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Tilted Dimensional Outline Frame (Rotated -15 deg) -->
  <g transform="rotate(-15, 256, 256)">
    <!-- Outer Cyan Wireframe Squircle -->
    <rect
      x="146"
      y="146"
      width="220"
      height="220"
      rx="62"
      stroke="#0891B2"
      stroke-width="5"
      fill="none"
    />

    <!-- Inset Depth Core with Translucent Fill -->
    <rect
      x="181"
      y="181"
      width="150"
      height="150"
      rx="42"
      fill="#0891B2"
      fill-opacity="0.08"
      stroke="#0891B2"
      stroke-width="2.5"
      stroke-opacity="0.6"
    />

    <!-- Dimensional Corner Struts -->
    <line x1="172" y1="172" x2="198" y2="198" stroke="#0891B2" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="340" y1="172" x2="314" y2="198" stroke="#0891B2" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="172" y1="340" x2="198" y2="314" stroke="#0891B2" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="340" y1="340" x2="314" y2="314" stroke="#0891B2" stroke-width="2" stroke-opacity="0.5"/>

    <!-- Docked Piece 1: Top-Left Cyan Chip -->
    <rect
      x="165"
      y="148"
      width="24"
      height="24"
      rx="6"
      fill="#0891B2"
    />

    <!-- Docked Piece 2: Bottom-Right Warning Bar (Rotated 25 deg) -->
    <g transform="translate(322, 318) rotate(25)">
      <rect
        x="-11"
        y="-30"
        width="22"
        height="60"
        rx="7"
        fill="#D97706"
        stroke="#FFFFFF"
        stroke-width="2"
      />
    </g>
  </g>
</svg>
